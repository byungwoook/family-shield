name: FamilyShield
options:
  bundleIdPrefix: com.familyshield
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - ko
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: TEAMID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  FamilyShieldCore:
    path: FamilyShieldCore
targets:
  FamilyShield:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/en.lproj
      - path: App/ko.lproj
    dependencies:
      - package: FamilyShieldCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyshield.app
        PRODUCT_NAME: FamilyShield
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FamilyShield.entitlements
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
          CODE_SIGN_ENTITLEMENTS: App/FamilyShieldDebug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DEV_LOGIN"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
          SWIFT_OPTIMIZATION_LEVEL: -O
  FamilyShieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FamilyShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyshield.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FamilyShield
        SWIFT_VERSION: "5.0"
schemes:
  FamilyShield:
    build:
      targets:
        FamilyShield: all
        FamilyShieldUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyShieldUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
